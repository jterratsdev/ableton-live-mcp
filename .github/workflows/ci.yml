name: CI

on:
  pull_request:
    paths-ignore:
      - .agent-workflow/**
      - "**/*.md"
  push:
    branches:
      - main
    paths-ignore:
      - .agent-workflow/**
      - "**/*.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 18
          cache: npm
      - name: Install audio analysis tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
      - name: Install dependencies
        run: npm ci
      - name: Run deterministic tests
        run: npm test
      - name: Compile Remote Script
        env:
          PYTHONPYCACHEPREFIX: /tmp/ableton-mcp-pycache
        run: python3 -m py_compile ableton_remote_scripts/AbletonMcpBridge/*.py
      - name: Validate package contents
        run: npm pack --dry-run --ignore-scripts
