name: Publish npm package

on:
  push:
    branches:
      - main
    paths:
      - package.json

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect-version:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      current: ${{ steps.version.outputs.current }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect package version change
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          current="$(node --print "require('./package.json').version")"
          git cat-file -e "${BEFORE_SHA}:package.json"
          previous="$(git show "${BEFORE_SHA}:package.json" | node -e "let value=''; process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => console.log(JSON.parse(value).version));")"

          if [ "$current" = "$previous" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "current=$current" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          lock_version="$(node --print "require('./package-lock.json').version")"
          test "$current" = "$lock_version"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"

  publish:
    needs: detect-version
    if: needs.detect-version.outputs.changed == 'true'
    environment: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install audio analysis tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
      - name: Update npm for trusted publishing
        run: npm install --global npm@latest
      - name: Verify detected version
        run: test "${{ needs.detect-version.outputs.current }}" = "$(node --print "require('./package.json').version")"
      - name: Install dependencies
        run: npm ci
      - name: Run deterministic tests
        run: npm test
      - name: Compile Remote Script
        env:
          PYTHONPYCACHEPREFIX: /tmp/ableton-mcp-pycache
        run: python3 -m py_compile ableton_remote_scripts/AbletonMcpBridge/*.py
      - name: Validate package contents
        run: npm pack --dry-run --ignore-scripts
      - name: Publish with provenance
        run: npm publish --ignore-scripts --access public --provenance
